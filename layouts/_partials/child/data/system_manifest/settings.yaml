settings:
  site:
    name: Hugo Agent Zero
    tagline: The is our FPO Hugo Agent Zero Tag Line
    copyright: Hugo Agent Zero # legal holder; may differ from site.name
  dates:
    default: publishdate
    publishdate:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    date:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    lastmod:
      term: Updated
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: false
      require_explicit: true
      must_be_after: publishdate
      must_be_after_seconds: 0
  desc:
    desc_short:
      term: Summary
    desc_long:
      term: Overview
  taxonomies:
    authors:
      term: Author
      list_tag: ul
      delimiter: ", "
      rel: author
      row_partial: haz/helpers/fn/fn_list_row_link_000
    categories:
      term: Categories
      list_tag: ul
      delimiter: ", "
      row_partial: haz/helpers/fn/fn_list_row_link_000
    tags:
      term: Tags
      list_tag: ul
      delimiter: ", "
      rel: tag
      row_partial: haz/helpers/fn/fn_list_row_link_000
  images:
    config:
      variant_sep: "_"
      class_prefix: "haz_img__"
      # Layout / sizes still use rem (aligned with --haz_measure ceiling).
      content_width: "45rem"
      breakpoints:
        desktop: "(min-width: 45rem)"
      # Ideal measure in px at rem ceiling — from DevTools (not 45×16).
      # Drives srcset Nw only. Author exports may round up (200/400/600/800/…) for KISS.
      content_width_px: 775
    # Variant keys = suffixes; Nw = round(content_width_px × factor).
    # At 775: xs 194, sm 388, md 581, lg 775, xl 1163, xxl 1550.
    variants:
      xs: 0.25
      sm: 0.5
      md: 0.75
      lg: 1.0
      xl: 1.5
      xxl: 2.0
    # Preset keys are mnemonic ids (convention: m{pct}_d{pct} = mobile then desktop
    # % of measure). Optional tablet: m{pct}_t{pct}_d{pct}. Lookup only — shortcode
    # does not parse segments. sizes + class are explicit.
    presets:
      "m100_d100":
        # Below measure ceiling: ~full viewport (gutters are small; 100vw avoids under-fetch).
        # At ceiling: cap at content_width (tracks --haz_measure rem).
        sizes: "(min-width: 45rem) 45rem, 100vw"
        class: haz_img__m100_d100
      "m50_d50":
        sizes: "(min-width: 45rem) 22.5rem, 50vw"
        class: haz_img__m50_d50
      "m25_d25":
        sizes: "(min-width: 45rem) 11.25rem, 25vw"
        class: haz_img__m25_d25
      "m100_d50":
        sizes: "(min-width: 45rem) 22.5rem, 100vw"
        class: haz_img__m100_d50
      "m100_d75":
        sizes: "(min-width: 45rem) 33.75rem, 100vw"
        class: haz_img__m100_d75
