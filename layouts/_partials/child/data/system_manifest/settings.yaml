settings:
  site:
    name: Hugo Agent Zero
    tagline: The is our FPO Hugo Agent Zero Tag Line
    copyright: Hugo Agent Zero # legal holder; may differ from site.name
  dates:
    default: publishdate
    publishdate:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    date:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    lastmod:
      term: Updated
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: false
      require_explicit: true
      must_be_after: publishdate
      must_be_after_seconds: 0
  desc:
    desc_short:
      term: Summary
    desc_long:
      term: Overview
  taxonomies:
    authors:
      term: Author
      list_tag: ul
      delimiter: ", "
      rel: author
      row_partial: haz/helpers/fn/fn_list_row_link_000
    categories:
      term: Categories
      list_tag: ul
      delimiter: ", "
      row_partial: haz/helpers/fn/fn_list_row_link_000
    tags:
      term: Tags
      list_tag: ul
      delimiter: ", "
      rel: tag
      row_partial: haz/helpers/fn/fn_list_row_link_000
  haz_img:
    config:
      variant_sep: "_"
      # How-wide spine (export lg / desktop sizes). Not the BPs.
      content_width: "55rem"
      rem_px: 16
      content_width_px: 1105
      # Parked. Size to the band; ~1rem hole pad is accepted overshoot.
      content_inset: 1
      # When (viewport px). Pico md / lg — not fractions of measure.
      breakpoints:
        min_tablet: 768
        min_desktop: 992
    # How-wide: lg = min(content_width_px, min_desktop). sm/md = 90% of (BP−1) capped at lg.
    # xs = ½ sm; xl/xxl = 1.5/2× lg. HQ skill: haz-img-exports.
