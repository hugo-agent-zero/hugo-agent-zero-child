settings:
  site:
    name: Hugo Agent Zero
    tagline: The is our FPO Hugo Agent Zero Tag Line
    copyright: Hugo Agent Zero # legal holder; may differ from site.name
  dates:
    default: publishdate
    publishdate:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    date:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    lastmod:
      term: Updated
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: false
      require_explicit: true
      must_be_after: publishdate
      must_be_after_seconds: 0
  desc:
    desc_short:
      term: Summary
    desc_long:
      term: Overview
  taxonomies:
    authors:
      term: Author
      list_tag: ul
      delimiter: ", "
      rel: author
      row_partial: haz/helpers/fn/fn_list_row_link_000
    categories:
      term: Categories
      list_tag: ul
      delimiter: ", "
      row_partial: haz/helpers/fn/fn_list_row_link_000
    tags:
      term: Tags
      list_tag: ul
      delimiter: ", "
      rel: tag
      row_partial: haz/helpers/fn/fn_list_row_link_000
  haz_img:
    config:
      variant_sep: "_"
      # Most pictures wait. Set false on the shortcode for a hero: lazy=false.
      default_lazy: true
      # Parked. Size to the band; ~1rem hole pad is accepted overshoot.
      content_inset: 1
      # Preset rwd.m|t|d ↔ these stamps (whole px). Unit in the name.
      # m/t = viewport max for that band (sizes= when + CSS @media);
      # d = column ceiling (not a BP). Open Props: --sm 480 / --md 768 / --size-lg 1024.
      # https://open-props.style/
      max_px:
        m: 479
        t: 767
        d: 1024
      # File menu: key → width px. Stamp; do not derive. Not the HTML sizes= attr.
      # sm|md|lg match max_px.m|t|d; xs/xl/xxl are extra rungs (DPR / smaller).
      width_px:
        xs: 240
        sm: 479
        md: 767
        lg: 1024
        xl: 1536
        xxl: 2048
      # Swappable helpers (child may point at another partial).
      helpers:
        variant_widths_fn: haz/helpers/fn/fn_haz_img_variant_widths.html
        band_resolve_fn: haz/helpers/fn/fn_haz_img_band_resolve.html
    # Mom types these names. Engine stays here.
    # rwd.m|t|d: w (25|33|50|67|75|100 % of column), align, ratio (e.g. "16/9"). Omit → inherit above.
    # fit cover for v1 when any band has ratio. class is leftovers.
    presets:
      story_wide:
        term: Wide
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "16/9"
      half_sqr_left:
        term: Half square left
        fit: cover
        rwd:
          m:
            w: 50
            align: left
            ratio: "1/1"
      half_sqr_right:
        term: Half square right
        fit: cover
        rwd:
          m:
            w: 50
            align: right
            ratio: "1/1"
      desk_half_left:
        term: Full then half left
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "16/9"
          d:
            w: 50
            align: left
      quarter_right:
        term: Quarter right
        fit: cover
        rwd:
          m:
            w: 25
            align: right
            ratio: "1/1"
      mid_center:
        term: Mid centered
        fit: cover
        rwd:
          m:
            w: 75
            align: center
            ratio: "4/3"
          t:
            w: 50
          d:
            w: 75
      as_is:
        term: As is
        rwd:
          m:
            w: 100
      story_tall:
        term: Tall
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "3/4"
    # rwd.m|t|d ↔ config.max_px + width_px.sm|md|lg. Helpers swappable.
