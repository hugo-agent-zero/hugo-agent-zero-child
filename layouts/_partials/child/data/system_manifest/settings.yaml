settings:
  site:
    name: Hugo Agent Zero
    tagline: The is our FPO Hugo Agent Zero Tag Line
    copyright: Hugo Agent Zero # legal holder; may differ from site.name
  # Traditional mins (Open Props --sm / --md / --size-lg).
  # m = tablet min. t = desktop min. d = column, not a third img/grid hop.
  # Readers prefer this. The old max-of-band stamp is parked at haz_img.config._max_px.
  breakpoints:
    m: 480
    t: 768
    d: 1024
  paging:
    posts_per_page: 10
    pager_pages: 10     # <ol> slots; held constant. 5+ recommended (first + last + current + ellipses), not enforced.
    pager_pages_swipe: true
  dates:
    default: publishdate
    publishdate:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    date:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    lastmod:
      term: Updated
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: false
      require_explicit: true
      must_be_after: publishdate
      must_be_after_seconds: 0
  desc:
    desc_short:
      term: Summary
    desc_long:
      term: Overview
  taxonomies:
    authors:
      term: Author
      singular: Author
      list_tag: ul
      delimiter: ", "
      rel: author
      row_partial: haz/helpers/fn/fn_list_row_link_000
    categories:
      term: Categories
      singular: Category
      list_tag: ul
      delimiter: ", "
      row_partial: haz/helpers/fn/fn_list_row_link_000
    tags:
      term: Tags
      singular: Tag
      list_tag: ul
      delimiter: ", "
      rel: tag
      row_partial: haz/helpers/fn/fn_list_row_link_000
  haz_img:
    config:
      variant_sep: "_"
      # Most pictures wait. Set false on the shortcode for a hero: lazy=false.
      default_lazy: true
      # Fill missing rwd_widths stubs via Hugo Resize (width-only; aspect kept).
      # Page-bundle stubs still win as Mom wrote them. Shortcode process= overrides.
      # true = Mom drops one master; Hugo fills the ladder. false = file-only.
      process: true
      # Parked. Size to the band; ~1rem hole pad is accepted overshoot.
      content_inset: 1
      # Parked. Old max-of-band stamp. Nothing reads this. Cleanup later.
      # m/t were the band ceilings (breakpoints.m|t - 1). d = column ceiling.
      _max_px:
        m: 479
        t: 767
        d: 1024
      # File menu for srcset + process. Stamp; do not derive. Not the HTML sizes= attr.
      # Each key (xs…xxl) is a ladder rung. sm|md|lg match the old band ceilings;
      # xs/xl/xxl are extra rungs (smaller / DPR).
      #   px — output width Hugo Resize targets (and the Nw in srcset).
      #   q  — quality (compression) for process-built rungs only; stubs ignore q.
      #        Keys under q are Hugo imaging format names (jpeg today; webp later).
      #        That value is passed on the Resize spec (e.g. "1024x q75") so Hugo
      #        recompresses while it resizes. 1–100 = HAZ wins; -1 or omit = leave
      #        qN off and use Hugo’s site default (imaging.jpeg.quality, usually 75).
      # Bare int still OK (lg: 1024 → px only, q.jpeg -1).
      rwd_widths:
        xs:
          px: 240
          q:
            jpeg: 70
        sm:
          px: 479
          q:
            jpeg: 75
        md:
          px: 767
          q:
            jpeg: 75
        lg:
          px: 1024
          q:
            jpeg: 75
        xl:
          px: 1536
          q:
            jpeg: 75
        xxl:
          px: 2048
          q:
            jpeg: 75
      # Swappable helpers (child may point at another partial).
      helpers:
        rwd_widths_fn: haz/helpers/fn/fn_haz_img_rwd_widths.html
        rwd_resolve_fn: haz/helpers/fn/fn_haz_img_rwd_resolve.html
    # Mom types the key (name="full_widescreen"). Engine stays here.
    # _term is parked: a human label for that key. Nothing reads it.
    # Layout x crop bank. Width stable on m unless the key is an alt hop.
    # Crops: sqr 1/1, portrait 3/4, landscape 4/3, widescreen 16/9.
    # Designer picks 3-5 keys for Mom. She may never see the whole bank.
    # Optional presets.*.rwd_widths deep-merges over config.rwd_widths for that key
    # (preset fields win; q maps merge per format — e.g. bump only lg.q.jpeg).
    presets:
      as_is:
        _term: As is
        rwd:
          m:
            w: 100
      full_sqr:
        _term: Full Sqr
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "1/1"
      full_portrait:
        _term: Full Portrait
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "3/4"
      full_landscape:
        _term: Full Landscape
        fit: cover
        rwd:
          m:
            w: 100
            ratio: "4/3"
      full_widescreen:
        _term: Full Widescreen
        fit: cover
        # Dogfood: lg process rung at q90 so _hu_ hash/bytes differ from config 75.
        rwd_widths:
          lg:
            q:
              jpeg: 90
        rwd:
          m:
            w: 100
            ratio: "16/9"
