settings:
  site:
    name: Hugo Agent Zero
    tagline: The is our FPO Hugo Agent Zero Tag Line
    copyright: Hugo Agent Zero # legal holder; may differ from site.name
  dates:
    default: publishdate
    publishdate:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    date:
      term: Published
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: true
    lastmod:
      term: Updated
      format_display: "January 2, 2006"
      format_datetime: "2006-01-02"
      pubdate: false
      require_explicit: true
      must_be_after: publishdate
      must_be_after_seconds: 0
  desc:
    desc_short:
      term: Summary
    desc_long:
      term: Overview
  taxonomies:
    authors:
      term: Author
      list_tag: ul
      delimiter: ", "
      rel: author
      row_partial: haz/helpers/fn/fn_list_row_link_000
    categories:
      term: Categories
      list_tag: ul
      delimiter: ", "
      row_partial: haz/helpers/fn/fn_list_row_link_000
    tags:
      term: Tags
      list_tag: ul
      delimiter: ", "
      rel: tag
      row_partial: haz/helpers/fn/fn_list_row_link_000
  haz_img:
    config:
      variant_sep: "_"
      # Most pictures wait. Set false on the shortcode for a hero: lazy=false.
      default_lazy: true
      # How-wide spine (export lg / desktop sizes). Not the BPs.
      content_width: "68ch"
      rem_px: 16
      # Inspect outer column 2026-09-24 — that is lg. Was 1105 at 55rem.
      content_width_px: 1065
      # Parked. Size to the band; ~1rem hole pad is accepted overshoot.
      content_inset: 1
      # When (viewport px). Copied from the CSS library — not from measure.
      # HAZ default = Pico md / lg (768 / 992). Pico is our opinion, not a lock:
      # swap the library → restamp these and the matching CSS @media literals.
      # https://picocss.com/docs
      breakpoints:
        min_tablet: 768
        min_desktop: 992
    # Mom types these names. Engine (m/t/d, ratio, fit) stays here.
    # Each band is a map: w (25|50|75|100), align (left|right|center|none).
    # Omit a band or field → inherit the one above. class is leftovers.
    presets:
      story_wide:
        term: Wide
        ratio: "16/9"
        fit: cover
        m:
          w: 100
      half_sqr_left:
        term: Half square left
        ratio: "1/1"
        fit: cover
        m:
          w: 50
          align: left
      half_sqr_right:
        term: Half square right
        ratio: "1/1"
        fit: cover
        m:
          w: 50
          align: right
      desk_half_left:
        term: Full then half left
        ratio: "16/9"
        fit: cover
        m:
          w: 100
        d:
          w: 50
          align: left
      quarter_right:
        term: Quarter right
        ratio: "1/1"
        fit: cover
        m:
          w: 25
          align: right
      mid_center:
        term: Mid centered
        ratio: "4/3"
        fit: cover
        m:
          w: 75
          align: center
        t:
          w: 50
        d:
          w: 75
      as_is:
        term: As is
        m:
          w: 100
      story_tall:
        term: Tall
        ratio: "3/4"
        fit: cover
        m:
          w: 100
    # How-wide: lg = content_width_px (the column). Not capped at min_desktop.
    # sm/md = 90% of (BP−1) capped at lg. xs = ½ sm; xl/xxl = 1.5/2× lg.
